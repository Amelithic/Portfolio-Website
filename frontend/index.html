<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio website with a blog and project gallery." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0916" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>AMELIE — Portfolio</title>

    <!--
      Keep the default below in sync with siteConfig.defaultTheme
      in frontend/src/config/site.ts.
    -->
    <script>
      ;(function () {
        var stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
